[package]
name = "trend-tv"
version = "0.5.0"
description = "CRT-TV trending GitHub companion"
edition = "2021"
build = "build.rs"

[lib]
name = "trend_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "trend-tv"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
scraper = "0.23"
dirs = "6"
